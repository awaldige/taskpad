<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskPad • Pro</title>

<meta name="description" content="TaskPad Pro - Gerenciador moderno de tarefas">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="main-header">

<div class="header-container">

<h1>📋 TaskPad</h1>

<div class="header-actions">

<button id="theme-toggle" class="btn-icon-theme">🌓</button>

<input type="search" id="search-input" placeholder="Buscar tarefas...">

<button id="open-modal" class="btn-primary">➕ Novo</button>

</div>
</div>
</header>

<main class="board">

<section class="column">

<div class="column-header">
<h2>🟡 Pendentes <span id="count-todo" class="count-pill">0</span></h2>
</div>

<ul id="todo-list" class="task-list"></ul>

</section>

<section class="column">

<div class="column-header">
<h2>🟢 Concluídas <span id="count-done" class="count-pill">0</span></h2>
</div>

<ul id="done-list" class="task-list"></ul>

</section>

</main>

<!-- MODAL -->

<div id="task-modal" class="modal-overlay">

<div class="modal-card">

<div class="modal-header">
<h3>Nova tarefa</h3>
<button id="close-modal-x">&times;</button>
</div>

<form id="task-form">

<input type="hidden" id="task-id">

<div class="form-group">
<label>Título</label>
<input type="text" id="task-title" required>
</div>

<div class="form-row">

<div class="form-group">
<label>Prioridade</label>

<select id="task-priority">
<option value="low">Baixa</option>
<option value="medium" selected>Média</option>
<option value="high">Alta</option>
</select>

</div>

<div class="form-group">
<label>Prazo</label>
<input type="date" id="task-deadline">
</div>

</div>

<div id="subtasks-edit-section" class="form-group" style="display:none">

<label>Subtarefas</label>

<div id="subtasks-editor-list"></div>

</div>

<div class="modal-footer">

<button type="button" id="close-modal" class="btn-cancel">Cancelar</button>

<button type="submit" class="btn-save">Salvar</button>

</div>

</form>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
