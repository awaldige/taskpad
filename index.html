<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPad Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>TaskPad</h1>
        <div class="top-controls">
            <button id="new-task" class="btn-primary">Nova tarefa</button>
        </div>
    </header>

    <main class="board">
        <section class="column">
            <h2>Pendentes</h2>
            <div id="todo" class="dropzone"></div>
        </section>

        <section class="column">
            <h2>Concluídas</h2>
            <div id="done" class="dropzone"></div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-card">
            <h3>Nova Tarefa</h3>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Título da tarefa" required>
                
                <select id="task-priority">
                    <option value="low">Baixa</option>
                    <option value="medium" selected>Média</option>
                    <option value="high">Alta</option>
                </select>

                <div class="modal-actions">
                    <button type="button" id="cancel-task">Cancelar</button>
                    <button type="submit" id="save-task">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
