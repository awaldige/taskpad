<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskPad • Kanban</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <h1>📋 TaskPad</h1>
            <button id="open-modal" class="btn-primary">➕ Novo</button>
        </div>
    </header>

    <main class="board">
        <section class="column">
            <h2>🟡 Pendentes</h2>
            <ul id="todo-list" class="task-list"></ul>
        </section>

        <section class="column">
            <h2>🟢 Concluídas</h2>
            <ul id="done-list" class="task-list"></ul>
        </section>
    </main>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>Nova Tarefa</h3>
            <div class="form-group">
                <label>O que precisa ser feito?</label>
                <input type="text" id="task-title" placeholder="Título da tarefa">
            </div>
            <div class="form-group">
                <label>Detalhes (opcional)</label>
                <textarea id="task-desc" rows="3" placeholder="Descreva os detalhes..."></textarea>
            </div>
            <div class="modal-footer">
                <button id="close-modal" class="btn-cancel">Cancelar</button>
                <button id="save-task" class="btn-save">Salvar Tarefa</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
