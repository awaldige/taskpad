<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskPad Pro</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<h2 class="logo">TaskPad</h2>

<nav>

<button class="menu-item active">
📋 Tarefas
</button>

<button class="menu-item">
📊 Dashboard
</button>

<button class="menu-item">
⚙ Configurações
</button>

</nav>

</aside>

<!-- MAIN -->

<main class="main">

<header class="topbar">

<input type="search" placeholder="Buscar tarefas">

<div class="top-actions">

<button id="theme-toggle">🌓</button>

<button id="new-task">Nova tarefa</button>

</div>

</header>

<section class="board">

<div class="column">

<h3>Pendentes</h3>

<div id="todo-list"></div>

</div>

<div class="column">

<h3>Concluídas</h3>

<div id="done-list"></div>

</div>

</section>

</main>

</div>

<script src="script.js"></script>

</body>

</html>
