<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskPad Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <div class="logo-area">
                <h1>TaskPad <span>Pro</span></h1>
            </div>
            <div class="actions-area">
                <input type="search" id="search-input" placeholder="Pesquisar tarefas...">
                <button id="theme-toggle" class="btn-icon">🌓</button>
                <button id="open-modal" class="btn-add">Nova Tarefa</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <div class="board-grid">
            <section class="board-column">
                <div class="column-title">
                    <span class="dot yellow"></span>
                    <h2>Pendentes</h2>
                    <span id="count-todo" class="badge">0</span>
                </div>
                <ul id="todo-list" class="task-cards-list"></ul>
            </section>

            <section class="board-column">
                <div class="column-title">
                    <span class="dot green"></span>
                    <h2>Concluídas</h2>
                    <span id="count-done" class="badge">0</span>
                </div>
                <ul id="done-list" class="task-cards-list"></ul>
            </section>
        </div>
    </main>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Detalhes da Tarefa</h3>
                <button type="button" id="close-modal-x" class="close-x">&times;</button>
            </div>
            
            <form id="task-form" class="modern-form">
                <input type="hidden" id="task-id">
                
                <div class="form-section">
                    <label>O que deve ser feito?</label>
                    <input type="text" id="task-title" placeholder="Nome da tarefa" required>
                </div>

                <div class="form-row">
                    <div class="form-section">
                        <label>Prioridade</label>
                        <select id="task-priority">
                            <option value="low">Baixa</option>
                            <option value="medium" selected>Média</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>
                    <div class="form-section">
                        <label>Vencimento</label>
                        <input type="date" id="task-deadline">
                    </div>
                </div>

                <div class="form-section subtasks-box">
                    <div class="sub-header">
                        <label>Subtarefas</label>
                        <button type="button" id="add-sub-field" class="btn-text">+ Adicionar</button>
                    </div>
                    <div id="subtasks-editor-list"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="close-modal" class="btn-outline">Cancelar</button>
                    <button type="submit" class="btn-confirm">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
