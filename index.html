<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskPad Kanban</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<h1>TaskPad</h1>

<div class="top-controls">

<select id="priority-filter">
<option value="all">Todas prioridades</option>
<option value="high">Alta</option>
<option value="medium">Média</option>
<option value="low">Baixa</option>
</select>

<button id="new-task">Nova tarefa</button>

</div>

</header>

<main class="board">

<section class="column">

<h2>Pendentes</h2>

<div id="todo" class="dropzone"></div>

</section>

<section class="column">

<h2>Concluídas</h2>

<div id="done" class="dropzone"></div>

</section>

</main>

<!-- MODAL -->

<div id="modal" class="modal">

<div class="modal-card">

<h3>Tarefa</h3>

<input id="task-title" placeholder="Título">

<select id="task-priority">

<option value="low">Baixa</option>
<option value="medium">Média</option>
<option value="high">Alta</option>

</select>

<input type="date" id="task-deadline">

<div id="subtasks"></div>

<input id="new-subtask" placeholder="Nova subtarefa">

<button id="add-sub">Adicionar subtarefa</button>

<div class="modal-actions">

<button id="save-task">Salvar</button>
<button id="cancel-task">Cancelar</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
